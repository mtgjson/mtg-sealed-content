name: Weekly Rebuild Outputs
on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# All writers share a queue; do not cancel a running or pending publication.
concurrency:
  group: sealed-content-writer
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.repository == 'mtgjson/mtg-sealed-content'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: generate and safely publish content
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_generated_content.py weekly
