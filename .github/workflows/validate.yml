name: validate contents

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  generated-content-freshness:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/generated/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check the source revision used for generation
        run: python3 scripts/publish_generated_content.py --check-freshness

  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo content
      uses: actions/checkout@v5

    - name: setup python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: install python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: test deck card counts
      run: python -m unittest discover -s tests

    - name: execute new products
      run: python scripts/contents_validator.py
