name: Twice-Daily Rebuild Outputs
on:
  schedule:
    - cron: 0 */12 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# All writers share a queue; do not cancel a running or pending publication.
concurrency:
  group: sealed-content-writer
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.repository == 'mtgjson/mtg-sealed-content'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Build the decklist JSON straight from the magic-preconstructed-decks
      # source so decks added today are available today, rather than waiting for
      # the separately-scheduled magic-preconstructed-decks-data export.
      - name: checkout preconstructed decklists source
        uses: actions/checkout@v4
        with:
          repository: taw/magic-preconstructed-decks
          path: preconstructed-decks

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: preconstructed-decks

      - name: build decklist json from source
        working-directory: preconstructed-decks
        run: bundle exec ruby bin/build_jsons "$RUNNER_TEMP/decks.json"

      - name: generate and safely publish content
        env:
          GH_TOKEN: ${{ github.token }}
          DECKS_JSON: ${{ runner.temp }}/decks.json
          TCG_AUTH: ${{ secrets.TCG_AUTH }}
          TCGPLAYER_CLIENT_ID: ${{ secrets.TCGPLAYER_CLIENT_ID }}
          TCGPLAYER_CLIENT_SECRET: ${{ secrets.TCGPLAYER_CLIENT_SECRET }}
        run: python scripts/publish_generated_content.py daily
